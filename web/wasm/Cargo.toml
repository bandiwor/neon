[package]
name = "neon-web"
version = "0.1.0"
edition = "2021"
description = "The Neon compiler as a WebAssembly module: a small C ABI around the library, JSON in and out"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
neon = { path = "../.." }

# its own workspace: the web build must not depend on the root package being a member
[workspace]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
